<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Rud Weather - live forecasts, rain radar, weather maps and weather news. Installable web app.">
  <meta name="theme-color" content="#1565C0">
  <meta name="color-scheme" content="light dark">

  <!-- Android / Chrome -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Rud Weather">

  <!-- iOS Safari (Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rud Weather">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96.png">
  <link rel="manifest" href="manifest.json">
  <title>Rud Weather</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0B3D91; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #2F80ED, #0B3D91); color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; transition: opacity .3s; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
    #splash p { margin-top: 16px; opacity: .85; letter-spacing: .5px; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""><p>Rud Weather</p></div>
  <script>
    // Remove the HTML splash once Flutter renders its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 350); }
    });
    // App-level service worker (offline shell + installability).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function (e) { console.warn('SW registration failed', e); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
